<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Substitution Planner — GDGPSD</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;height:100%;background:#EEF2F7;font-family:'Segoe UI',Arial,sans-serif}
  #app{display:block;border:0;width:100%;height:100vh}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#EEF2F7;color:#0041a3;font-size:.9rem;font-weight:600;letter-spacing:.5px;z-index:2;
    transition:opacity .4s}
  #loading.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loading">Loading planner…</div>
<iframe id="app" title="GDGPSD Substitution Planner" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<script>
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycbyiIvckjAKlunlEGkRZwVOik2wA3-3M7sSIEcNgZoLqGS-oC5FSZqRzcOZnPgDruqu2_A/exec';
  var frame = document.getElementById('app');
  var loading = document.getElementById('loading');
  frame.src = BASE + (window.location.search || '');
  frame.addEventListener('load', function () {
    setTimeout(function () { loading.classList.add('hide'); }, 300);
  });
  setTimeout(function () { loading.classList.add('hide'); }, 15000);
})();
</script>
</body>
</html>
